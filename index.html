<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CyberVault Store</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      background: url('https://raw.githubusercontent.com/SoulSSGives/CyberVault/refs/heads/index/Backround.png') no-repeat center center fixed;
      background-size: cover;
      color: #00bfff;
      font-family: 'Roboto Mono', monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
    }

    .logo {
      width: 200px;
      border: 5px solid #00bfff;
      border-radius: 10px;
      padding: 10px;
      box-shadow: 0 0 15px #00bfff;
      animation: pulse 2s infinite ease-in-out;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.05); opacity: 0.8; }
    }

    h1 {
      font-size: 2rem;
      margin: 20px 0 10px;
    }

    .typing-text {
      font-size: 1.2rem;
      height: 1.5em;
      border-right: 2px solid #00bfff;
      white-space: nowrap;
      overflow: hidden;
      animation: typing 4s steps(40, end), blink 0.8s step-end infinite;
    }

    @keyframes typing {
      from { width: 0; }
      to { width: 100%; }
    }

    @keyframes blink {
      50% { border-color: transparent; }
    }

    .social-buttons {
      display: flex;
      gap: 20px;
      margin-top: 20px;
    }

    .social-btn {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      overflow: hidden;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 0 10px #00bfff;
    }

    .social-btn img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.3s ease;
    }

    .social-btn:hover {
      transform: scale(1.1);
      box-shadow: 0 0 20px #00bfff;
    }

    .offers {
      margin-top: 30px;
      text-align: center;
    }

    .offers h2 {
      font-size: 1.5rem;
      margin-bottom: 10px;
    }

    .offers p {
      font-size: 1.1rem;
      margin: 5px 0;
    }

    .products-btn {
      padding: 15px 30px;
      font-size: 1.2rem;
      color: #ffffff;
      background-color: #00bfff;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      box-shadow: 0 0 10px #00bfff;
      transition: all 0.3s ease;
      margin-top: 20px;
    }

    .products-btn:hover {
      background-color: #008cbb;
      box-shadow: 0 0 20px #00bfff;
    }

    .footer {
      position: absolute;
      bottom: 20px;
      font-size: 1rem;
      color: #00bfff;
    }
  </style>
</head>
<body>
  <img src="CyberVault logo.jpg" alt="CyberVault Logo" class="logo">
  <h1>Welcome to CyberVault Store</h1>
  <div class="typing-text" id="typewriter"></div>

  <div class="social-buttons">
    <div class="social-btn" onclick="window.location.href='https://discord.gg/M3TEYEME'">
      <img src="Discord.jpg" alt="Discord">
    </div>
    <div class="social-btn" onclick="window.location.href='https://www.instagram.com/cybervaultstore/'">
      <img src="Instagram.jpg" alt="Instagram">
    </div>
  </div>

  <div class="offers">
    <h2>🔥 Best Offers:</h2>
    <p>💸 Affordable Prices</p>
    <p>🔒 Safe & Secure</p>
    <p>🚀 Instant Delivery</p>
    <p>📈 Followers: <span id="followers-count">Loading...</span></p>
    <p>👥 Members: <span id="members-count">Loading...</span></p>
  </div>

  <button class="products-btn" onclick="window.location.href='Products.html'">View Products</button>

  <div class="footer">
    Made with 💙
  </div>

  <script>
    const phrases = [
      "Your vault of digital treasures...",
      "Exclusive deals inside ⚡️",
      "Join the ultimate store for tech lovers."
    ];

    let currentPhrase = 0;
    let currentChar = 0;
    let typing = true;

    const typewriter = document.getElementById('typewriter');

    function type() {
      const text = phrases[currentPhrase];
      if (typing) {
        typewriter.textContent = text.substring(0, currentChar++);
        if (currentChar > text.length) {
          typing = false;
          setTimeout(type, 1500);
        } else {
          setTimeout(type, 50);
        }
      } else {
        typewriter.textContent = text.substring(0, currentChar--);
        if (currentChar === 0) {
          typing = true;
          currentPhrase = (currentPhrase + 1) % phrases.length;
          setTimeout(type, 500);
        } else {
          setTimeout(type, 30);
        }
      }
    }

    type();

    // Function to fetch Instagram followers count
    async function fetchInstagramFollowers() {
      const response = await fetch('https://www.instagram.com/cybervaultstore?__a=1');
      const data = await response.json();
      const followersCount = data.graphql.user.edge_followed_by.count;
      document.getElementById('followers-count').textContent = followersCount;
    }

    // Function to fetch Discord members count
    async function fetchDiscordMembers() {
      const response = await fetch('https://discord.com/api/v10/invites/M3TEYEME');
      const data = await response.json();
      const membersCount = data.approximate_member_count;
      document.getElementById('members-count').textContent = membersCount;
    }

    // Fetch counts on page load
    window.onload = () => {
      fetchInstagramFollowers();
      fetchDiscordMembers();
    };
  </script>
</body>
</html>
